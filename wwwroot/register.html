<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdminLTE v4 | Register Akun</title>

    <!-- AdminLTE v4 CSS -->
    <link rel="stylesheet" href="dist/css/adminlte.css" />
    <!-- Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="register-page bg-body-secondary">
    <div class="register-box">
      <div class="card card-outline card-primary">
        <div class="card-header text-center">
          <a href="#" class="h1"><b>Admin</b>LTE App</a>
        </div>
        <div class="card-body register-card-body">
          <p class="login-box-msg">Daftar Akun Baru</p>

          <!-- Place untuk alert -->
          <div id="alert-message"></div>

          <form id="form-register">
            <div class="input-group mb-3">
              <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Username"
                required
              />
              <div class="input-group-text">
                <span class="bi bi-person-fill"></span>
              </div>
            </div>
            <div class="input-group mb-3">
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Email (Opsional / Jika ada di DTO)"
                required
              />
              <div class="input-group-text">
                <span class="bi bi-envelope"></span>
              </div>
            </div>
            <div class="input-group mb-3">
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Password"
                required
              />
              <div class="input-group-text">
                <span class="bi bi-lock-fill"></span>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <button
                  type="submit"
                  id="btn-submit"
                  class="btn btn-primary w-100"
                >
                  Daftar
                </button>
              </div>
            </div>
          </form>

          <p class="mt-3 mb-0 text-center">
            <a href="login.html" class="text-center"
              >Saya sudah punya akun (Login)</a
            >
          </p>
        </div>
      </div>
    </div>

    <!-- AdminLTE v4 JS -->
    <script src="dist/js/adminlte.js"></script>

    <!-- Config & Script Fetch JS -->
    <script src="js/config.js"></script>
    <script>
      document
        .getElementById('form-register')
        .addEventListener('submit', async function (e) {
          e.preventDefault();

          const btn = document.getElementById('btn-submit');
          const alertBox = document.getElementById('alert-message');

          btn.disabled = true;
          btn.innerText = 'Memproses...';
          alertBox.innerHTML = '';

          // Sesuaikan JSON ini dengan RegisterDto di C# .NET kamu
          const payload = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          };

          try {
            const response = await fetch(`${CONFIG.BASE_URL}/auth/register`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });

            const data = await response.json();

            if (response.ok) {
              alertBox.innerHTML = `<div class="alert alert-success">Pendaftaran Berhasil! Mengalihkan ke halaman login...</div>`;
              setTimeout(() => {
                window.location.href = 'login.html';
              }, 1500);
            } else {
              alertBox.innerHTML = `<div class="alert alert-danger">${data.message || 'Gagal mendaftar! Periksa kembali inputan Anda.'}</div>`;
            }
          } catch (error) {
            alertBox.innerHTML = `<div class="alert alert-danger">Gagal terhubung ke Server Backend.</div>`;
          } finally {
            btn.disabled = false;
            btn.innerText = 'Daftar';
          }
        });
    </script>
  </body>
</html>
