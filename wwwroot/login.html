<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdminLTE v4 | Log in</title>

    <!-- AdminLTE v4 CSS -->
    <link rel="stylesheet" href="dist/css/adminlte.css" />
    <!-- Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="login-page bg-body-secondary">
    <div class="login-box">
      <div class="card card-outline card-primary">
        <div class="card-header text-center">
          <a href="#" class="h1"><b>Admin</b>LTE App</a>
        </div>
        <div class="card-body login-card-body">
          <p class="login-box-msg">Masuk untuk memulai sesi Anda</p>

          <!-- Tempat menampilkan Notifikasi/Alert -->
          <div id="alert-message"></div>

          <form id="form-login">
            <!-- Diubah dari Email ke Username -->
            <div class="input-group mb-3">
              <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Username"
                required
                autocomplete="username"
              />
              <div class="input-group-text">
                <span class="bi bi-person-fill"></span>
              </div>
            </div>
            <div class="input-group mb-3">
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Password"
                required
                autocomplete="current-password"
              />
              <div class="input-group-text">
                <span class="bi bi-lock-fill"></span>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <button
                  type="submit"
                  id="btn-submit"
                  class="btn btn-primary w-100"
                >
                  Sign In
                </button>
              </div>
            </div>
          </form>

          <p class="mb-1 mt-3">
            <a href="forgot-password.html">Lupa password?</a>
          </p>
          <p class="mb-0">
            <a href="register.html" class="text-center">Daftar akun baru</a>
          </p>
        </div>
      </div>
    </div>

    <!-- AdminLTE v4 JS -->
    <script src="dist/js/adminlte.js"></script>

    <!-- Config & Script Fetch JS -->
    <script src="js/config.js"></script>
    <script src="js/auth-helper.js"></script>
    <script>
      document
        .getElementById('form-login')
        .addEventListener('submit', async function (e) {
          e.preventDefault();

          const btn = document.getElementById('btn-submit');
          const alertBox = document.getElementById('alert-message');

          btn.disabled = true;
          btn.innerText = 'Memproses...';
          alertBox.innerHTML = '';

          const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          };

          try {
            const response = await fetch(`${CONFIG.BASE_URL}/Auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              credentials: 'include',
            });

            if (response.status === 429) {
              alertBox.innerHTML = `<div class="alert alert-warning">Terlalu banyak percobaan login! Silakan tunggu 1 menit lagi.</div>`;
              return;
            }

            // Tangan jika backend merespons 204 No Content
            if (response.status === 204) {
              alertBox.innerHTML = `<div class="alert alert-warning">Server merespons 204 (No Content). Silakan coba lagi.</div>`;
              return;
            }

            const data = await response.json();

            if (response.ok) {
              const token = data.token || data.data?.token || data.accessToken;
              if (token) {
                localStorage.setItem('access_token', token);
              }

              alertBox.innerHTML = `<div class="alert alert-success">Login Berhasil! Mengalihkan...</div>`;

              const DASHBOARD_PAGES = {
                Admin: 'admin-dashboard.html',
                Manager: 'manager-dashboard.html',
                Engineer: 'engineer-dashboard.html',
                User: 'dashboard.html',
              };

              // DIPERBAIKI: Menggunakan getUserInfo() sesuai fungsi di auth-helper.js
              const currentUser =
                typeof getUserInfo === 'function' ? getUserInfo() : null;
              const userRole = currentUser?.role || 'User';

              const targetPage = DASHBOARD_PAGES[userRole] || 'dashboard.html';

              setTimeout(() => {
                window.location.href = targetPage;
              }, 1000);
            } else {
              alertBox.innerHTML = `<div class="alert alert-danger">${data.message || 'Login Gagal! Check username/password.'}</div>`;
            }
          } catch (error) {
            console.error('Error Login:', error);
            alertBox.innerHTML = `<div class="alert alert-danger">Gagal terhubung ke Server Backend. (${error.message})</div>`;
          } finally {
            btn.disabled = false;
            btn.innerText = 'Sign In';
          }
        });
    </script>
  </body>
</html>
