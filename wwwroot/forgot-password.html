<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdminLTE v4 | Lupa Password</title>

    <!-- AdminLTE v4 CSS -->
    <link rel="stylesheet" href="dist/css/adminlte.css" />
    <!-- Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="login-page bg-body-secondary">
    <div class="login-box">
      <div class="card card-outline card-primary">
        <div class="card-header text-center">
          <a href="#" class="h1"><b>Admin</b>LTE App</a>
        </div>
        <div class="card-body login-card-body">
          <p class="login-box-msg">
            Lupa password Anda? Masukkan email yang terdaftar untuk menerima
            link/instruksi reset password.
          </p>

          <!-- Place untuk notifikasi/alert -->
          <div id="alert-message"></div>

          <form id="form-forgot">
            <div class="input-group mb-3">
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Email"
                required
              />
              <div class="input-group-text">
                <span class="bi bi-envelope"></span>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <button
                  type="submit"
                  id="btn-submit"
                  class="btn btn-primary w-100"
                >
                  Kirim Link Reset
                </button>
              </div>
            </div>
          </form>

          <p class="mt-3 mb-0">
            <a href="login.html">Kembali ke Login</a>
          </p>
        </div>
      </div>
    </div>

    <!-- AdminLTE v4 JS -->
    <script src="dist/js/adminlte.js"></script>

    <!-- Config & Script Fetch JS -->
    <script src="js/config.js"></script>
    <script>
      document
        .getElementById('form-forgot')
        .addEventListener('submit', async function (e) {
          e.preventDefault();

          const btn = document.getElementById('btn-submit');
          const alertBox = document.getElementById('alert-message');

          btn.disabled = true;
          btn.innerText = 'Mengirim...';
          alertBox.innerHTML = '';

          const payload = {
            email: document.getElementById('email').value,
          };

          try {
            const response = await fetch(
              `${CONFIG.BASE_URL}/auth/forgot-password`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              },
            );

            const data = await response.json();

            if (response.ok) {
              alertBox.innerHTML = `<div class="alert alert-success">${data.message || 'Instruksi reset password telah dikirim ke email Anda!'}</div>`;
            } else {
              alertBox.innerHTML = `<div class="alert alert-danger">${data.message || 'Email tidak ditemukan.'}</div>`;
            }
          } catch (error) {
            alertBox.innerHTML = `<div class="alert alert-danger">Gagal terhubung ke Server Backend.</div>`;
          } finally {
            btn.disabled = false;
            btn.innerText = 'Kirim Link Reset';
          }
        });
    </script>
  </body>
</html>
